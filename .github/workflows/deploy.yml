# Gen1 infrastructure is locked after its stateful resources moved to Project3.
# This repository validates the retained reference; Project3 publishes both sites.
name: Validate preserved Gen1 reference
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gen1-reference-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Validate the preserved Gen1 source
        run: npm run validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gen1-reference-validation
          path: evidence/synthesis.json
          retention-days: 14
